<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:24px;background:#020617;font-family:Arial,Helvetica,sans-serif;color:#e2e8f0">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" style="max-width:420px;background:#0f172a;border:1px solid #1e293b;border-radius:16px" cellspacing="0" cellpadding="0">
            <tr>
              <td style="padding:32px 28px;text-align:center">
                <p style="margin:0 0 4px;font-size:12px;letter-spacing:4px;color:#60a5fa;font-weight:bold">SMARTHAIL</p>
                <h1 style="margin:0 0 16px;font-size:20px;color:#ffffff">Confirme seu e-mail</h1>
                <p style="margin:0 0 20px;font-size:14px;color:#94a3b8">Digite este código no aplicativo para concluir o cadastro:</p>
                <p style="margin:0 0 20px;font-size:32px;letter-spacing:10px;font-family:'Courier New',monospace;font-weight:bold;color:#ffffff">{{ .Token }}</p>
                <p style="margin:0;font-size:12px;color:#64748b">O código expira em 1 hora. Se você não criou uma conta no SMARTHAIL, ignore este e-mail.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>

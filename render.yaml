services:
  # Site estático: gratuito, servido por CDN e sem cold start
  # (diferente dos serviços "web" do plano free, que hibernam).
  - type: web
    name: smarthail
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: NODE_VERSION
        value: "20"
    # SPA: qualquer rota (/dashboard, /risk-maps…) devolve o index.html
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # O app pede geolocalização; nenhuma outra permissão sensível
      - path: /*
        name: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
